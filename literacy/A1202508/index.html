  <title>
  コンピュータリテラシーHTMLサンプル
  </title>
      <style>
		  h2{	
        color:rgb(13, 66, 240);
        }
        p{
            font-size:18px;
        }
        .hisoku{
          color: #9dc9c7;
        }
        #board
       {
            border-collapse: collapse;
            background-color:black;
        }

        td.cell
        {
            writing-mode: horizontal-tb;  
            border: 2px solid black;
            background-color: rgb(79, 221, 247);
            width: 100px;
            height: 100px;
        }
    </style>
    <script>  
        function sakusei()
       {
            let i,j;
            let ban = document.getElementById("board");
            let youbi = ['月','火','水','木','金']
            let kaisuu = 0 ;
            ban.textContent = "";  
            for ( i = 1 ; i < 7 ; i++)
           {
                let tr = document.createElement("tr");
                for ( j = 0 ; j < 5 ; j++)
            	{
                	let td = document.createElement("td");
                	td.className = "cell";
                  td.id = kaisuu;
                  td.textContent = "     " + youbi[j] + i + "     ";
                    td.setAttribute("onclick","ichi(this)");
                	tr.appendChild(td);
                  kaisuu = kaisuu + 1;
                }
                ban.appendChild(tr);
            }
        }
        function ichi(koko)
        {
          let getuyou = "", kayou = ['','', '応用簿記', '地域経済学','プログラミング言語論',''];
          let suiyou = ['ミクロ経済学基礎','地域産業論','','Eビジネス論','Eビジネス論'];
          let mokuyou = ['','','財務会計論','経営戦略論','卒研ゼミ',''];
          let kinyou = ['統計解析','統計解析','原価計算','データベース','データベース',''];
          let jugyou = [getuyou,kayou,suiyou,mokuyou,kinyou]
          let id = Number(koko.id);
          let youbi = id % 5;
          let n = Math.floor(id / 5);
          koko.textContent = jugyou[youbi] [n];
          koko.style.backgroundColor = "white";
        }
      
    </script>
  </head>
  <body>
  <!-- body要素の内容 -->
